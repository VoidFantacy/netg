   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="585.13518" transform="rotate(-0 46.2924 585.13518)">ACSG · 当前方法说明 · 2026-11-05 · 依据已实现流程整理</text>
  </g>
  <g id="text_21">
   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="781.07904" y="585.13518" transform="rotate(-0 781.07904 585.13518)">01</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="147.831015" transform="rotate(-0 50.5008 147.831015)">在线输入：查询向量 q</text>
  </g>
  <g id="text_23">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="285.634912" transform="rotate(-0 50.5008 285.634912)">同一次GT10路由产生的三个入口ID，也用于读取对应的三行残差表。</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="314.523689" transform="rotate(-0 50.5008 314.523689)">默认主链仍为GT10；直接补点是保留的残差研究方案，按配置附加启用。</text>
  </g>
  <g id="text_25">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #2c6b9e" x="50.5008" y="361.683194" transform="rotate(-0 50.5008 361.683194)">GT10在这里提供什么</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10.5px; font-family: 'Noto Sans SC'; fill: #203b50" transform="translate(50.5008 386.461744)">画像小图检索得到路由结果，再映射到真实数据ID，由原NSG图搜索</text>
   <text style="font-size: 10.5px; font-family: 'Noto Sans SC'; fill: #203b50" transform="translate(50.5008 402.652334)">返回Top-K。画像用于路由，真实ID用作主图入口。</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #147d69" x="446.0904" y="361.683194" transform="rotate(-0 446.0904 361.683194)">直接补点增加什么</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'Noto Sans SC'; fill: #203b50" transform="translate(446.0904 386.461744)">根据路由读取离线候选表，计算候选与查询的真实相似度或距离，将</text>
   <text style="font-size: 10.5px; font-family: 'Noto Sans SC'; fill: #203b50" transform="translate(446.0904 402.634533)">候选作为答案参与Top-K合并。</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9.5px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="561.320606" transform="rotate(-0 50.5008 561.320606)">图中的“直接补点（16K表）”对应完整B32表；8K表采用相同补点流程，造表监督来源不同。</text>
  </g>
