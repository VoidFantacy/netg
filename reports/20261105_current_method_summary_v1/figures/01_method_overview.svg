  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="72.862335" transform="rotate(-0 46.2924 72.862335)">GT10负责选择图搜索入口；直接残差补点在主搜索完成后补充候选，并合并最终答案。</text>
  </g>
