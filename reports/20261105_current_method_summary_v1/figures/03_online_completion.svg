  <g id="text_29">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="46.2924" y="45.540993" transform="rotate(-0 46.2924 45.540993)">在线：查三行表，精确打分，合并答案</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="72.862335" transform="rotate(-0 46.2924 72.862335)">全部剩余候选使用原向量、原任务metric评分。这里的精确评分不含额外的学习排序器。</text>
  </g>
  <g id="text_31">
   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="585.13518" transform="rotate(-0 46.2924 585.13518)">ACSG · 当前方法说明 · 2026-11-05 · 依据已实现流程整理</text>
  </g>
  <g id="text_32">
   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="781.07904" y="585.13518" transform="rotate(-0 781.07904 585.13518)">03</text>
  </g>
  <g id="text_33">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="122.316314" transform="rotate(-0 50.5008 122.316314)">一次查询的实际处理顺序</text>
  </g>
  <g id="text_34">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="92.5848" y="158.806193" transform="rotate(-0 92.5848 158.806193)">得到GT10的主返回 R_K，并复用该查询的三个路由入口。</text>
  </g>
  <g id="text_35">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="92.5848" y="225.495472" transform="rotate(-0 92.5848 225.495472)">读取三个入口对应的B32表，合并最多96个候选ID。</text>
  </g>
  <g id="text_36">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="92.5848" y="292.746784" transform="rotate(-0 92.5848 292.746784)">去除重复ID，以及已经出现在主返回中的ID，得到 C(q)。</text>
  </g>
  <g id="text_37">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="92.5848" y="359.479032" transform="rotate(-0 92.5848 359.479032)">对全部 C(q) 计算原向量相似度或距离。</text>
  </g>
  <g id="text_38">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="92.5848" y="426.103" transform="rotate(-0 92.5848 426.103)">将主返回和补点候选按原metric合并，输出最终Top-K。</text>
  </g>
  <g id="text_39">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="479.7576" y="122.316314" transform="rotate(-0 479.7576 122.316314)">K1示例（人为示意数值）</text>
  </g>
  <g id="text_40">
   <text style="font-size: 10.5px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="479.7576" y="276.389016" transform="rotate(-0 479.7576 276.389016)">主返回：{a}；查表并去重后：{a,b,c,d}</text>
  </g>
  <g id="text_41">
   <text style="font-weight: 700; font-size: 10.5px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #147d69" x="479.7576" y="300.807084" transform="rotate(-0 479.7576 300.807084)">排除已有 a，补算候选：{b,c,d}</text>
  </g>
  <g id="text_42">
   <text style="font-weight: 700; font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #147d69" x="479.7576" y="479.770696" transform="rotate(-0 479.7576 479.770696)">相似度越大越好，最终K1返回 c。</text>
  </g>
  <g id="text_43">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="504.981705" transform="rotate(-0 50.5008 504.981705)">合并规则与返回数量</text>
  </g>
