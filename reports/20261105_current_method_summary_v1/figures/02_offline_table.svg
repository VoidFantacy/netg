  <g id="text_11">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="304.318425" transform="rotate(-0 50.5008 304.318425)">① 将遗漏关联到该查询实际命中的三个路由行</text>
  </g>
  <g id="text_12">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="330.247472" transform="rotate(-0 50.5008 330.247472)">例如查询 q_i 漏掉目标 x，且路由到 h1、h2、h3，则在这三行中放入 x 都可能覆盖同一个遗漏事件。</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="387.680025" transform="rotate(-0 50.5008 387.680025)">② 优先选择新增覆盖最多的“路由行—目标ID”</text>
  </g>
  <g id="text_14">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="413.059072" transform="rotate(-0 50.5008 413.059072)">实现采用全局覆盖贪心，按8→16→32逐级扩容并保留已有前缀。每步计算尚未覆盖的遗漏事件数；同一事件被多行命中只计一次。</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="474.018825" transform="rotate(-0 50.5008 474.018825)">③ 冻结路由ID到候选ID列表的查找表</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="499.409904" transform="rotate(-0 50.5008 499.409904)">线上读取的是已选好的真实数据ID。K1与K100共用这张以K100/L200遗漏生成的表；8K表沿用相同选表机制。</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.2px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="50.5008" y="548.452207" transform="rotate(-0 50.5008 548.452207)">GT用于离线生成遗漏监督；线上补点不读取GT。造表实现：E183 residual_tools.cpp 的 teacher / compile_tables / extend。</text>
  </g>
 </g>
