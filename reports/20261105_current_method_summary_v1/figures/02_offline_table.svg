   <g id="text_1">
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(89.6436 139.341488)">合法训练查询</text>
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(84.496725 155.569163)">及其真实GT100</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(291.880125 139.341488)">运行GT10</text>
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(286.691062 155.569163)">K100 / L200</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(482.2164 139.341488)">逐查询比较</text>
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(482.319337 155.569163)">记录遗漏ID</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(665.0028 139.341488)">按路由覆盖挑选</text>
    <text style="font-size: 10.8px; font-family: 'Noto Sans SC'; fill: #147d69" transform="translate(664.511737 155.569163)">每行最多32个ID</text>
   </g>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #203b50" x="46.2924" y="45.540993" transform="rotate(-0 46.2924 45.540993)">离线：把训练查询的遗漏编成B32表</text>
  </g>
  <g id="text_6">
   <text style="font-size: 10px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="72.862335" transform="rotate(-0 46.2924 72.862335)">残差指主搜索没有返回的真实近邻ID；每个“训练查询—遗漏目标”构成一个单位覆盖事件。</text>
  </g>
  <g id="text_7">
   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="46.2924" y="585.13518" transform="rotate(-0 46.2924 585.13518)">ACSG · 当前方法说明 · 2026-11-05 · 依据已实现流程整理</text>
  </g>
  <g id="text_8">
   <text style="font-size: 8px; font-family: 'Noto Sans SC'; text-anchor: start; fill: #607380" x="781.07904" y="585.13518" transform="rotate(-0 781.07904 585.13518)">02</text>
  </g>
  <g id="text_9">
